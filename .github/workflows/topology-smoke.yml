name: Production topology smoke

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      advisory:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    continue-on-error: ${{ inputs.advisory || false }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: topology
          install-filter: kpdev
          cache-build: "false"
      - name: Build production images
        uses: docker/bake-action@v7
        with:
          builder: default
          source: .
          files: .railway/topology/compose.yml
          targets: gateway,web,api,docs
          set: |
            *.context=.
            gateway.cache-from=type=gha,scope=kipivo-gateway
            web.cache-from=type=gha,scope=kipivo-web
            api.cache-from=type=gha,scope=kipivo-api
            docs.cache-from=type=gha,scope=kipivo-docs
      - name: Verify the production topology
        run: kpdev smoke topology
      - name: Report an advisory failure
        if: failure() && inputs.advisory
        run: echo '::warning::Production topology smoke failed. See the job logs.'
