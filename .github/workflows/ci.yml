name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, next]

permissions:
  contents: read

env:
  TURBO_SCM_HEAD: ${{ github.sha }}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      base: ${{ steps.plan.outputs.base }}
      ui: ${{ steps.plan.outputs.ui }}
      cli: ${{ steps.plan.outputs.cli }}
      mobile: ${{ steps.plan.outputs.mobile }}
      auth: ${{ steps.plan.outputs.auth }}
      e2e: ${{ steps.plan.outputs.e2e }}
      web-e2e: ${{ steps.plan.outputs.web-e2e }}
      has-images: ${{ steps.plan.outputs.has-images }}
      images: ${{ steps.plan.outputs.images }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install only the pinned Turbo binary
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next')
        shell: bash
        run: scripts/ci-install-turbo.sh
      - name: Select CI jobs
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' && github.token || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bun run ci:plan --base "$BASE_SHA" --head "$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/next ]; then
            bun run ci:plan --next
          else
            bun run ci:plan --full
          fi
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: check
      - run: bun run check
  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-26.04
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: ui
      - uses: ./.github/actions/setup-playwright
        with:
          workspace: apps/storybook
      - run: bun run turbo run 'storybook#ci:ui' ${{ needs.changes.outputs.base && '--affected' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-results
          path: apps/storybook/test-results/
          if-no-files-found: ignore
          retention-days: 7
  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-26.04
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: cli
      - run: bun run turbo run 'kipivo#ci:cli' ${{ needs.changes.outputs.base && '--affected' || '' }}
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-26.04
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: mobile
      - run: bun run turbo run 'mobile#build' ${{ needs.changes.outputs.base && '--affected' || '' }}
  images:
    needs: changes
    if: needs.changes.outputs.has-images == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: images-${{ matrix.app }}
          install-dependencies: ${{ matrix.app == 'api' }}
          cache-build: "false"
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          builder: default
          context: .
          file: ${{ matrix.dockerfile }}
          tags: kipivo-${{ matrix.app }}:ci
          cache-from: type=gha,scope=kipivo-${{ matrix.app }}
          cache-to: type=gha,scope=kipivo-${{ matrix.app }},mode=max
      - name: Check the image filesystem
        run: bash scripts/check-image.sh kipivo-${{ matrix.app }}:ci
      - name: Smoke test the Web image
        if: matrix.app == 'web'
        run: scripts/smoke-web-image.sh kipivo-web:ci
      - name: Verify API image migrations and readiness
        if: matrix.app == 'api'
        timeout-minutes: 10
        run: scripts/smoke-api-image.sh kipivo-api:ci
      - name: Verify gateway image routing and request preservation
        if: matrix.app == 'gateway'
        timeout-minutes: 5
        run: scripts/smoke-gateway-image.sh kipivo-gateway:ci
  topology:
    name: Topology smoke (advisory)
    needs: changes
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/next' &&
      needs.changes.outputs.has-images == 'true'
    uses: ./.github/workflows/topology-smoke.yml
    with:
      advisory: true
  auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kipivo
          POSTGRES_PASSWORD: kipivo_test
          POSTGRES_DB: kipivo_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kipivo -d kipivo_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kipivo:kipivo_test@127.0.0.1:5432/kipivo_auth_test
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: auth
      - uses: ./.github/actions/setup-playwright
        with:
          workspace: tests/e2e
      - run: bun run turbo run '@kipivo/e2e#ci:auth' ${{ needs.changes.outputs.base && '--affected' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: auth-test-results
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: e2e
      - run: bun run turbo run '@kipivo/e2e#ci:integration' ${{ needs.changes.outputs.base && '--affected' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
  web-e2e:
    name: Web E2E (advisory)
    needs: changes
    if: needs.changes.outputs.web-e2e == 'true'
    runs-on: ubuntu-26.04
    continue-on-error: true
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: web-e2e
      - uses: ./.github/actions/setup-playwright
        with:
          workspace: tests/e2e
      - run: bun run turbo run '@kipivo/e2e#ci:web-e2e' ${{ needs.changes.outputs.base && '--affected' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: web-playwright-results
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
  result:
    name: CI result
    if: always()
    needs: [changes, check, ui, cli, mobile, auth, e2e, images]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Require all selected blocking jobs to succeed
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun scripts/ci-result.mjs
