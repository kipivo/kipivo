name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: docker build --tag kipivo-web:ci .
      - name: Smoke test the Docker image
        run: |
          container=$(docker run --detach --env PORT=8080 --publish 127.0.0.1:3000:8080 kipivo-web:ci)
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:3000/healthz
          node scripts/smoke-web.mjs http://127.0.0.1:3000
