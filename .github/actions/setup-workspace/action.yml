name: Set up workspace
description: Install pinned runtimes and dependencies with Bun, Turbo, and Vite caches.

inputs:
  cache-scope:
    description: Job-specific scope for task and Vite caches.
    required: true
  install-dependencies:
    description: Restore the Bun package cache and install workspace dependencies.
    default: "true"
  cache-build:
    description: Restore and save Turbo task artifacts and Vite dependency caches.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@v2
      id: bun
      with:
        bun-version-file: package.json
    - name: Cache Bun packages
      if: inputs.install-dependencies == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-
    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: bun install --frozen-lockfile
    - name: Cache Turbo tasks and Vite dependencies
      if: inputs.cache-build == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .turbo/cache
          node_modules/.vite
          apps/*/node_modules/.vite
        key: tasks-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', '.node-version', 'package.json') }}-${{ github.sha }}
        restore-keys: |
          tasks-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', '.node-version', 'package.json') }}-
