name: Set up workspace
description: Install the pinned mise toolchain and workspace dependencies with Bun, Turbo, Vite, and Storybook caches.

inputs:
  cache-scope:
    description: Job-specific scope for task, Vite, and Storybook caches.
    required: true
  install-dependencies:
    description: Restore the Bun package cache and install workspace dependencies.
    default: "true"
  cache-build:
    description: Restore and save Turbo task artifacts, Vite dependencies, and Storybook caches.
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v5
      with:
        install_args: ${{ inputs.install-dependencies == 'false' && 'bun' || '' }}
    - name: Read the Bun version for cache keys
      if: inputs.install-dependencies == 'true' || inputs.cache-build == 'true'
      id: bun
      shell: bash
      run: printf 'bun-version=%s\n' "$(bun --version)" >> "$GITHUB_OUTPUT"
    - name: Cache Bun packages
      if: inputs.install-dependencies == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-
    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: bun install --frozen-lockfile
    - name: Cache Turbo tasks, Vite dependencies, and Storybook
      if: inputs.cache-build == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .turbo/cache
          node_modules/.vite
          apps/*/node_modules/.vite
          apps/storybook/node_modules/.cache/storybook
        key: tasks-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'mise.toml', 'mise.lock') }}-${{ github.sha }}
        restore-keys: |
          tasks-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'mise.toml', 'mise.lock') }}-
