name: Set up Playwright
description: Cache Chromium for the workspace's Playwright version and install missing system dependencies.

inputs:
  workspace:
    description: Workspace containing the Playwright dependency.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright
      working-directory: ${{ inputs.workspace }}
      shell: bash
      run: |
        version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Cache Chromium headless shell
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-shell-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Ensure Chromium is installed
      working-directory: ${{ inputs.workspace }}
      shell: bash
      run: bun run playwright install --only-shell chromium
    - name: Install system dependencies if Chromium cannot launch
      working-directory: ${{ inputs.workspace }}
      shell: bash
      run: |
        check_chromium() {
          node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close()'
        }
        if ! check_chromium; then
          bun run playwright install-deps chromium
          check_chromium
        fi
