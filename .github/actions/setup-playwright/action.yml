name: Set up Playwright
description: Cache Chromium for the workspace's Playwright version and install missing system dependencies.

inputs:
  workspace:
    description: Workspace containing the Playwright dependency.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright
      working-directory: ${{ inputs.workspace }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/resolve-version.sh"
    - name: Cache Chromium headless shell
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-shell-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Ensure Chromium is installed
      working-directory: ${{ inputs.workspace }}
      shell: bash
      run: bun run --bun playwright install --only-shell chromium
    - name: Install system dependencies if Chromium cannot launch
      working-directory: ${{ inputs.workspace }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/ensure-chromium-deps.sh"
