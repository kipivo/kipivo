<svg id="intro" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 388" width="560" height="388">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#48443d"/></pattern>
    <linearGradient id="lid" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ffac71"/><stop offset="1" stop-color="#ff7050"/></linearGradient>
    <pattern id="traces" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 0H18V18" fill="none" stroke="#784739" stroke-width="1"/></pattern>
    <g id="base" stroke-linejoin="round"><path d="M-94 -94 H94 V94 H-94Z"/></g>
    <g id="register" fill="none" stroke="#aca69a" stroke-width="1"><path d="M-5 0H5 M0 -5V5"/></g>
  </defs>
  <style>
    @keyframes open-plates {
      from { transform: translateY(var(--travel)) }
    }
    @keyframes lift {
      0%, 100% { transform: translateY(var(--travel)) }
      27%, 69% { transform: translateY(0) }
    }
    @keyframes trace {
      0%, 5%, 96%, 100% { stroke-dashoffset: 1 }
      27%, 72% { stroke-dashoffset: 0 }
    }
    .top { --travel: 38px }
    .middle { --travel: 21px }
    #intro:target :is(.top, .middle) { animation: open-plates 1.6s ease-out }
    .timeline :is(.top, .middle) { animation: lift 6s ease-in-out infinite }
    .timeline .mark { stroke-dasharray: 1; animation: trace 6s ease-in-out infinite }
  </style>
  <rect width="560" height="388" fill="#201f1e"/><rect width="560" height="388" fill="url(#dots)"/>
  <g stroke="#615a50" fill="none" stroke-dasharray="3 6"><path d="M40 168 494 377 M62 371 520 161 M280 36V356"/></g>
  <g transform="matrix(1 .46 -1 .46 280 257)">
    <use href="#base" transform="translate(6 6)" fill="#171717" stroke="#776e61"/>
    <use href="#base" fill="#343330" stroke="#aaa090"/>
    <path d="M-83 -83H83V83H-83Z" fill="none" stroke="#787368"/>
    <g fill="#b1a58e"><circle cx="-75" cy="-75" r="3"/><circle cx="75" cy="-75" r="3"/><circle cx="75" cy="75" r="3"/><circle cx="-75" cy="75" r="3"/></g>
  </g>
  <g stroke="#b68b63" stroke-dasharray="3 5"><path d="M92 163v94 M468 163v94 M280 250v94"/></g>
  <g class="middle"><g transform="matrix(1 .46 -1 .46 280 207)">
    <use href="#base" transform="translate(4 4)" fill="#372722" stroke="#935642"/>
    <use href="#base" fill="#66392f" stroke="#ff9d73"/><use href="#base" fill="url(#traces)"/>
    <g fill="none" stroke="#f69a6b" stroke-width="2"><path d="M-70 65V16L-37 -17H25 M-61 72V26L-28 -7H33 M67 58H30L12 40H-6"/></g>
  </g></g>
  <g class="top"><g transform="matrix(1 .46 -1 .46 280 151)">
    <use href="#base" transform="translate(5 5)" fill="#c96346" stroke="#ff9974"/>
    <use href="#base" fill="url(#lid)" stroke="#ffbd8f"/>
    <path d="M-83 -83H83V83H-83Z" fill="none" stroke="#bb6244"/>
    <g fill="#704536"><circle cx="-75" cy="-75" r="2.5"/><circle cx="75" cy="-75" r="2.5"/><circle cx="75" cy="75" r="2.5"/><circle cx="-75" cy="75" r="2.5"/></g>
    <g transform="translate(-67 -68) scale(1.35)" stroke="#332a25" stroke-linecap="round" stroke-linejoin="round" stroke-width="15" fill="none">
      <path class="mark" pathLength="1" d="M24 24V80"/><path class="mark" pathLength="1" d="M26 54 52 28"/><path class="mark" pathLength="1" d="M32 48 58 80"/>
      <circle cx="77" cy="19" r="9" fill="#ffe4a9" stroke="none"/>
    </g>
  </g></g>
  <g fill="none" stroke="#aaa090"><path d="M389 111h37l19 -19h49"/><circle cx="389" cy="111" r="2.5" fill="#ffb788"/><path d="M176 271h-41l-21 21H63"/></g>
  <g font-family="monospace" font-size="12" fill="#c7bdaf"><text x="460" y="85">01/A</text><text x="64" y="309">03/C</text></g>
  <use href="#register" x="25" y="24"/><use href="#register" x="535" y="24"/><use href="#register" x="25" y="364"/><use href="#register" x="535" y="364"/>
</svg>
